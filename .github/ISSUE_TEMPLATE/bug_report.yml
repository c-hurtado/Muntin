name: Bug
description: Something in FanciestZones doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: FanciestZones is not made by Microsoft. Report FanciestZones problems here, not to PowerToys.
  - type: input
    id: version
    attributes:
      label: Version
      description: Right-click FanciestZones.exe, Properties, Details, Product version
      placeholder: 0.1.0.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The steps that lead to the problem
      placeholder: |
        1. Held Shift and dragged a window onto another window
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: A screenshot or a short recording helps.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Windows version, how many monitors, their resolution and scaling
      placeholder: Windows 11 24H2, two monitors, 3840x2160 at 150% and 2560x1440 at 100%
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Optional. Tray icon, Open settings folder, then the newest file under Logs.
      render: text
